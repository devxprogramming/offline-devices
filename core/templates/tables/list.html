<div class="content-wrapper">
  <div class="card">
    <div class="card-body">
      <h4 class="card-title">List of Devices</h4>
      {% comment %}
      <p class="card-description">
        Add class <code>.table-striped</code> {% endcomment %}
      </p>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Serial Number</th>
              <th>BANK</th>
              <th>Branch</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            {% for device in devices %}
            <tr>
              <td class="py-1">{{device.serial_number}}</td>
              <td>{{device.branch.bank}}</td>
              <td>{{device.branch}}</td>
              <td>
                <div class="progress">
                  <div
                    class="progress-bar bg-success"
                    role="progressbar"
                    style="width: 25%"
                    aria-valuenow="25"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  ></div>
                </div>
              </td>
            </tr>
            {% empty %}
            <tr>
              <td colspan="4">No Device Found</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
